[package]
name = "portpilot"
version = "1.0.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
sysinfo = "0.33"
netstat2 = "0.11"
tauri-plugin-single-instance = "2"
